name: jkt48-quota-watch

# Jalan 24/7 di server GitHub — laptop boleh mati.
#
# Cara kerja: satu run "hidup" ~55 menit dan cek kuota tiap 60 detik, lalu di akhir
# dia memanggil dirinya sendiri (workflow_dispatch) supaya rantainya nyambung terus.
# Jadwal */5 di bawah cuma jaring pengaman: kalau rantainya putus, jadwal ini yang
# menyalakan lagi. Run yang datang saat sudah ada rantai jalan langsung keluar
# (lihat step "guard") jadi tidak ada penumpukan run.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      iterations:
        description: "jumlah cek (1 cek/menit)"
        default: "55"
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: jkt48-quota-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Guard — skip kalau rantai sudah jalan
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_ME: ${{ github.run_id }}
          GITHUB_EV: ${{ github.event_name }}
        run: |
          python3 - <<'PY' || true
          import json, os, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          me = int(os.environ["GITHUB_ME"])
          ev = os.environ["GITHUB_EV"]
          hdr = {"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                 "Accept": "application/vnd.github+json", "User-Agent": "guard"}
          others = []
          for status in ("in_progress", "queued"):
              url = (f"https://api.github.com/repos/{repo}/actions/workflows/watch.yml"
                     f"/runs?status={status}&per_page=50")
              try:
                  req = urllib.request.Request(url, headers=hdr)
                  data = json.loads(urllib.request.urlopen(req, timeout=30).read())
                  others += [r["id"] for r in data.get("workflow_runs", []) if r["id"] != me]
              except Exception as exc:
                  print("guard: gagal baca daftar run:", exc)
          limit = 1 if ev == "schedule" else 2
          skip = len(others) >= limit
          print(f"event={ev} run lain={len(others)} -> skip={skip}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"skip={'true' if skip else 'false'}\n")
          PY

      - name: Cache browser stealth
        if: steps.guard.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/scrapling
            ~/.cache/camoufox
          key: scrapling-browsers-v1

      - name: Install Scrapling (browser stealth buat lolos Cloudflare)
        if: steps.guard.outputs.skip != 'true'
        run: |
          python3 -m pip install --quiet "scrapling[fetchers]"
          scrapling install || scrapling install --force

      - name: Cek kuota tiap 60 detik
        if: steps.guard.outputs.skip != 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          USE_SCRAPLING: "1"
          ITER: ${{ github.event.inputs.iterations || '55' }}
        run: |
          set -u
          git config user.name  "jkt48-quota-watch"
          git config user.email "jkt48-quota-watch@users.noreply.github.com"
          simpan() {
            if [ -n "$(git status --porcelain)" ]; then
              git add -A
              git commit -q -m "$1" || true
              git pull -q --rebase --autostash origin main || true
              git push -q || echo "push gagal (diabaikan)"
            fi
          }
          i=1
          while [ "$i" -le "$ITER" ]; do
            echo "::group::cek ke-$i dari $ITER"
            python3 watch.py || echo "watch.py error (diabaikan, loop lanjut)"
            echo "::endgroup::"
            simpan "state: $(date -u +%Y-%m-%dT%H:%MZ)"
            if [ "$(cat .heartbeat 2>/dev/null || true)" != "$(date -u +%F)" ]; then
              date -u +%F > .heartbeat
              simpan "heartbeat $(cat .heartbeat)"
            fi
            if [ "$i" -lt "$ITER" ]; then sleep 60; fi
            i=$((i + 1))
          done

      - name: Sambung ke run berikutnya
        if: always() && steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -s -o /dev/null -w "dispatch HTTP %{http_code}\n" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/watch.yml/dispatches" \
            -d '{"ref":"main"}'
